<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>イベント — Festival Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="events-page centered-page">
  <nav class="app-nav wide">
    <span class="who" id="who">読み込み中...</span>
    <div class="app-nav-links">
      <a href="map.html" class="nav-link">マップ</a>
      <a href="events.html" class="nav-link is-active">イベント</a>
      <a href="dashboard.html" class="nav-link">グループ</a>
      <a href="shifts.html" class="nav-link">シフト</a>
    </div>
    <div class="app-nav-right">
      <button class="link-button" id="logout-btn">ログアウト</button>
    </div>
  </nav>

  <div class="message" id="event-message" role="alert"></div>

  <div class="events-layout">
    <div class="card">
      <div class="card-header-row">
        <h2 class="section-title">イベントの選択</h2>
        <button class="button-secondary" id="open-create-event-modal" type="button">＋ イベント追加</button>
      </div>
      <p class="helper-text">ブース・企画の登録は、イベントを選んだ上でそれぞれの管理ページから行えます。</p>
      <div class="field">
        <label for="admin-event-select">イベントを選ぶ</label>
        <select id="admin-event-select">
          <option value="">イベントを選択してください</option>
        </select>
      </div>
      <div class="item-actions">
        <a class="button-secondary" id="event-detail-link" href="event-details.html">イベント詳細を見る</a>
        <a class="button-secondary" id="booth-manage-link" href="booths.html">ブースを管理</a>
        <a class="button-secondary" id="program-manage-link" href="programs.html">企画を管理</a>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="create-event-modal" hidden>
    <div class="modal">
      <h2 class="section-title">イベントを追加する</h2>
      <form id="create-event-form">
        <div class="field">
          <label for="event-name">イベント名</label>
          <input type="text" id="event-name" placeholder="例: 五月祭" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="event-start-date">開始日</label>
            <input type="date" id="event-start-date" required>
          </div>
          <div class="field">
            <label for="event-end-date">終了日</label>
            <input type="date" id="event-end-date" required>
          </div>
        </div>
        <button type="submit" class="primary">イベントを作成する</button>
      </form>
      <button class="link-button" id="close-create-event-modal" style="width:100%; margin-top:10px;">閉じる</button>
    </div>
  </div>

  <script type="module" src="js/events.js"></script>
</body>
</html>
