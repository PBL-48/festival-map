<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ブース管理 — Festival Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="events-page centered-page">
  <nav class="app-nav wide">
    <span class="who" id="who">読み込み中...</span>
    <div class="app-nav-links">
      <a href="map.html" class="nav-link">マップ</a>
      <a href="events.html" class="nav-link is-active">イベント</a>
      <a href="dashboard.html" class="nav-link">グループ</a>
      <a href="shifts.html" class="nav-link">シフト</a>
    </div>
    <div class="app-nav-right">
      <button class="link-button" id="logout-btn">ログアウト</button>
    </div>
  </nav>

  <div class="message" id="booth-message" role="alert"></div>

  <div class="events-layout">
    <div class="card">
      <div class="card-header-row">
        <h2 class="section-title">ブース管理</h2>
        <a href="events.html" class="button-secondary">← イベントに戻る</a>
      </div>

      <div class="field">
        <label for="booth-event-select">対象イベント</label>
        <select id="booth-event-select">
          <option value="">イベントを選択してください</option>
        </select>
      </div>

      <form id="create-booth-form">
        <div class="field">
          <label for="booth-name">ブース名</label>
          <input type="text" id="booth-name" placeholder="例: たこ焼き店" required>
        </div>
        <div class="event-map-shell">
          <div id="event-booth-map"></div>
          <p class="map-hint static" id="booth-map-hint">地図をクリックしてブースの位置を決めてください</p>
        </div>
        <p class="helper-text" id="booth-coords">座標未設定</p>
        <button type="submit" class="primary">ブースを登録する</button>
      </form>

      <div class="field-list-wrap">
        <h3 class="subsection-title">登録済みのブース</h3>
        <ul class="group-list" id="booth-list">
          <li class="group-empty">まだブースがありません</li>
        </ul>
      </div>
    </div>
  </div>

  <script type="module" src="js/booths.js"></script>
</body>
</html>
